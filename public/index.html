<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9ED4E0" />
    <meta name="description" content="CritterTrack - Professional pedigree tracking and management" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>CritterTrack Pedigree App</title>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- This is the container where your React app will be rendered -->
    <div id="root"></div>
    
    <script>
      // Register service worker with update checking
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
            .then((registration) => {
              console.log('[App] SW registered:', registration);
              
              const checkForUpdate = () => registration.update().catch(err => {
                console.warn('[App] SW update check failed:', err);
              });

              // Check periodically and whenever a backgrounded phone browser is reopened.
              setInterval(checkForUpdate, 60000);
              window.addEventListener('focus', checkForUpdate);
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') checkForUpdate();
              });
              checkForUpdate();
              
              // Listen for new service worker installation
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('[App] New service worker found, installing...');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[App] New service worker version is ready.');
                    window.SW_UPDATE_AVAILABLE = true;
                    window.dispatchEvent(new Event('sw-update-available'));
                  }
                });
              });
            })
            .catch((error) => {
              console.error('[App] SW registration failed:', error);
            });
        });
      }
    </script>
</body>
</html>
